# Configuración de la aplicación y vistas JSP
spring.application.name=evidencias
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Conexión a la base de datos MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/portafolio_bd?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
# "update" creará las tablas automáticamente basadas en tu código Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect